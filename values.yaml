# Default values for marschart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1
namespace: default

marsimage:
  repository: nocsysmars/mars
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "sia"
  defaultAPP: "drivers,openflow,fwd,proxyarp,snmp,linkdiscovery,com.nocsys.alert,com.nocsys.analyzer,com.nocsys.monitor,com.nocsys.calcpath,com.nocsys.defaultcfg,com.nocsys.drivers.nocsys.gnmi,com.nocsys.drivers.nocsys.rest,com.nocsys.drivers.nocsys.snmp,com.nocsys.eventclient,com.nocsys.healthycheck,com.nocsys.ntpserver,com.nocsys.provider.switchpolling,com.nocsys.storm-control,com.nocsys.qos,com.nocsys.switchmgmt,com.nocsys.useraccount,com.nocsys.utility,com.nocsys.webssh"
  defaultTopology: clos
  
nginximage:
  repository: nocsysmars/nginx
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "1.27.0-sia"
  
esimage:
  repository: nocsysmars/elasticsearch
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "6.1.0-sia"

logstashimage:
  repository: nocsysmars/logstash
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "6.1.0-sia"
  
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: NodePort
  port: 443

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: 
  mars:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  #  limits:
  #    cpu: 500m
  #   memory: 1000Mi
    requests:
      cpu: 500m
      memory: 1000Mi
  es:
    requests:
      cpu: 500m
      memory: 1000Mi
  logstash:
    requests:
      cpu: 500m
      memory: 1000Mi
nginx:
    requests:
      cpu: 500m
      memory: 1000Mi
      
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
